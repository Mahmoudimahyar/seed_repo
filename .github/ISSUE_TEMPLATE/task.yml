name: Change proposal
description: Propose a focused improvement with acceptance criteria.
title: "proposal: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and intended users
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and non-goals
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Observable acceptance and validation
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Existing solutions, research, costs and risks
